server {
    listen       80;
    server_name  localhost; # 替换为你的域名或 localhost

    # 1. 指定前端打包后的 dist 目录路径
    root   /usr/share/nginx/html/dist;
    index  index.html;

    # 2. 关键配置：处理 Vue Router History 模式
    # 如果找不到文件，则回退到 index.html，让 Vue 接管路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 3. 静态资源缓存优化 (可选但推荐)
    # 对 js/css/img 等文件设置长期缓存，利用文件名 hash 机制
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 4. API 反向代理配置
    location /api/ {
        # 后端 API 服务器地址
        proxy_pass http://172.20.0.1:8080/api/; 
        
        # 必要的 Header 设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 支持（如果后端有 WS 接口）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 5. 禁止访问隐藏文件 (如 .git, .env)
    location ~ /\. {
        deny all;
    }

    # 6. 错误页面处理 (可选)
    error_page 404 /index.html;
}
